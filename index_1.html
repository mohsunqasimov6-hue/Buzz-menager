<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BizManager – Biznes idarəetmə / Business management</title>
<meta name="description" content="BizManager: satış, stok, müştəri və maliyyəni telefonunuzdan idarə edin. Business management app for sales, stock, customers and finance.">
<style>
:root{--bg:#f4f7fc;--card:#fff;--ink:#0f1b33;--mut:#64748b;--line:#e2e8f0;--pri:#1d4ed8;--pri2:#dbeafe;--navy:#1e3a8a;--ok:#0f9d6b;--bad:#d64545;--warn:#c98a0b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c30;--ink:#e8eefc;--mut:#8fa0bf;--line:#223051;--pri:#5b8def;--pri2:#1a2a52;--navy:#9db8ff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--pri);color:#fff}
header b{font-size:18px;letter-spacing:.2px}
header small{display:block;opacity:.8;font-size:12px}
.lang{display:flex;background:rgba(255,255,255,.18);border-radius:10px;padding:2px}
.lang button{border:0;background:none;color:#fff;padding:6px 11px;border-radius:8px;font-weight:600;font-size:13px}
.lang button.on{background:#fff;color:var(--pri)}
main{padding:14px 16px}
h2{font-size:17px;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.kpi small{color:var(--mut);display:block;font-size:12.5px}
.kpi b{font-size:19px;color:var(--navy)}
.kpi.main{grid-column:span 2;background:var(--pri);border-color:var(--pri)}
.kpi.main small,.kpi.main b{color:#fff}
.kpi.main b{font-size:26px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list{display:flex;flex-direction:column;gap:9px}
.item b{display:block}.item small{color:var(--mut)}
.amt{font-weight:700;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--pri2);color:var(--navy)}
.tag.completed{background:#d9f5ea;color:#0a7a52}.tag.cancelled{background:#fde3e3;color:#a82d2d}.tag.preparing{background:#fff1d1;color:#8a5d00}
.tag.low{background:#fde3e3;color:#a82d2d}
button.btn,.fab{border:0;border-radius:11px;background:var(--pri);color:#fff;font-weight:600;padding:10px 14px;font-size:14px}
button.btn.ghost{background:var(--pri2);color:var(--navy)}
button.btn.danger{background:#fde3e3;color:#a82d2d}
button.sm{padding:6px 10px;font-size:13px}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:calc(86px + env(safe-area-inset-bottom,0px));border-radius:99px;padding:13px 18px;box-shadow:0 6px 18px rgba(29,78,216,.35);z-index:6}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{max-width:520px;margin:0 auto;display:flex}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0 7px;font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:19px}
nav button.on{color:var(--pri);font-weight:700}
input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:10px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 13px;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#ov{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:20;display:none;align-items:flex-end;justify-content:center}
#ov.show{display:flex}
#sheet{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;z-index:50;display:none}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mut);margin:6px 0}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.empty{text-align:center;color:var(--mut);padding:26px 0}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
svg text{fill:var(--mut);font-size:10px}
#auth{position:fixed;inset:0;z-index:40;background:var(--pri);display:none;align-items:center;justify-content:center;padding:20px;overflow:auto}
.acard{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:400px}
.acard h1{font-size:22px;margin:4px 0;color:var(--navy)}
.acard .lang{background:var(--pri2);float:right}.acard .lang button{color:var(--navy)}.acard .lang button.on{background:var(--pri);color:#fff}
.acct{border:0;background:rgba(255,255,255,.18);color:#fff;padding:7px 10px;border-radius:10px;font-weight:600;font-size:13px}
#landing{display:none}
.hero{background:var(--pri);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 36px}
.hero .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}
.hero h1{font-size:28px;line-height:1.2;margin:0 0 10px}
.hero p{opacity:.9;margin:0 0 22px}
.hero .btn{background:#fff;color:var(--pri);padding:13px 26px;font-size:16px}
.lw{max-width:900px;margin:0 auto;padding:0 20px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fgrid .card b{color:var(--navy)}
.step{display:flex;gap:12px;align-items:center;margin:10px 0}
.step i{font-style:normal;background:var(--pri);color:#fff;width:28px;height:28px;border-radius:99px;display:grid;place-items:center;font-weight:700;flex:none}
nav button{font-size:9.5px;min-width:0;overflow:hidden;white-space:nowrap}
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg{max-width:88%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.err{color:var(--bad)}
.askbar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;background:var(--bg);padding:8px 0}
.askbar input{margin:0}
.pbar{height:10px;border-radius:99px;background:var(--pri2);overflow:hidden}.pbar i{display:block;height:100%;background:var(--pri);width:0;transition:width .2s}
.msg.f{align-self:stretch;max-width:100%;background:var(--pri2);color:var(--ink);font-size:13.5px}
</style>
</head>
<body>
<div id="app">
  <header><div style="cursor:pointer" onclick="location.hash='home'"><b>BizManager</b><small id="sub"></small></div>
  <div style="display:flex;gap:8px;align-items:center"><button class="acct" onclick="shareM()">⤴</button><button class="acct" id="acct" onclick="acctM()"></button><div class="lang"><button id="l-az" onclick="setLang('az')">AZ</button><button id="l-en" onclick="setLang('en')">EN</button></div></div></header>
  <main id="main"></main>
</div>
<nav><div id="nav"></div></nav>
<div id="ov" onclick="if(event.target===this)closeM()"><div id="sheet"></div></div>
<div id="landing"></div>
<div id="auth"></div>
<div id="toast"></div>

function seed(){
 let s=7;const r=()=>(s=(s*9301+49297)%233280)/233280;
 DB.products=[["Qəhvə dənələri 1kq",14,24,38],["Çay dəsti",9,18,25],["Termos 500ml",11,22,7],["Keramika kruzka",3.5,8,60],["Şokolad qutusu",6,12.5,32],["Təbii bal 500q",8,15,5],["Quru meyvə mix",5,11,44],["Hədiyyə səbəti",22,45,12]]
  .map((p,i)=>({id:i+1,name:p[0],buy:p[1],sell:p[2],stock:p[3]}));
 DB.customers=[["Aysel Məmmədova","+994 50 123 45 67"],["Elçin Quliyev","+994 55 234 56 78"],["Günel Həsənova","+994 70 345 67 89"],["Rəşad Əliyev","+994 51 456 78 90"],["Nigar İsmayılova","+994 77 567 89 01"],["Tural Hüseynov","+994 60 678 90 12"]]
  .map((c,i)=>({id:i+1,name:c[0],phone:c[1]}));
 let oid=1;const out=[];
 for(let d=175;d>=0;d--){const n=r()<.78?1+Math.floor(r()*2):0;
  for(let k=0;k<n;k++){const items=[];const m=1+Math.floor(r()*2);
   for(let j=0;j<m;j++){const p=DB.products[Math.floor(r()*8)];items.push({p:p.id,q:1+Math.floor(r()*3),price:p.sell,cost:p.buy})}
   let st="completed";if(d>3&&r()<.08)st="cancelled";if(d<=3){const x=r();st=x<.35?"new":x<.65?"preparing":"completed"}
   out.push({id:oid++,cust:1+Math.floor(r()*6),date:TODAY-d*DAY,status:st,items})}}
 DB.orders=out;
 let xid=1;
 for(let m=0;m<6;m++){const b=new Date(TODAY);b.setDate(1);b.setMonth(b.getMonth()-m);const ts=b.getTime();
  DB.tx.push({id:xid++,type:"expense",cat:"Kirayə",amt:600,date:ts,note:""},{id:xid++,type:"expense",cat:"Maaş",amt:900,date:ts+DAY,note:""},
   {id:xid++,type:"expense",cat:"Kommunal",amt:70+Math.round(r()*40),date:ts+9*DAY,note:""});
  if(m%2===0)DB.tx.push({id:xid++,type:"income",cat:"Digər",amt:120+Math.round(r()*80),date:ts+14*DAY,note:"Konsultasiya"});}
 for(let d=0;d<28;d+=4)DB.tx.push({id:xid++,type:"expense",cat:"Reklam",amt:15+Math.round(r()*35),date:TODAY-d*DAY,note:""});
}

const oTotal=o=>o.items.reduce((a,i)=>a+i.price*i.q,0);
const oCost=o=>o.items.reduce((a,i)=>a+i.cost*i.q,0);
function stats(from,to){
 const live=DB.orders.filter(o=>o.date>=from&&o.date<to&&o.status!=="cancelled"),os=live.filter(o=>o.status==="completed");
 const tx=DB.tx.filter(x=>x.date>=from&&x.date<to);
 const sales=os.reduce((a,o)=>a+oTotal(o),0),cogs=os.reduce((a,o)=>a+oCost(o),0);
 const exp=tx.filter(x=>x.type==="expense").reduce((a,x)=>a+x.amt,0),inc=tx.filter(x=>x.type==="income").reduce((a,x)=>a+x.amt,0);
 return{sales,exp,inc,cogs,count:live.length,pending:live.filter(o=>o.status!=="completed").reduce((a,o)=>a+oTotal(o),0),profit:sales+inc-cogs-exp}}
const monthStart=(off=0)=>{const d=new Date(TODAY);d.setDate(1);d.setMonth(d.getMonth()+off);return d.getTime()};
const pname=id=>(DB.products.find(p=>p.id===id)||{name:"?"}).name;
const cname=id=>(DB.customers.find(c=>c.id===id)||{name:"?"}).name;

/* ============ Hesab və abunə (PROTOTİP) ============
 Hazırda brauzerdə saxlanır və TƏHLÜKƏSİZ DEYİL. Real versiyada Auth və kod yoxlaması serverə (Supabase/Firebase) köçürülməlidir. */
const SUBSCRIPTION_ON=false; /* false = pulsuz versiya (giriş və abunə söndürülüb). Abunəni qaytarmaq üçün true edin. */
const TRIAL_DAYS=3,PLAN_DAYS=30,PRICE="10 ₼";
const DEMO_CODES=["BM-DEMO-0001","BM-DEMO-0002","BM-DEMO-0003"];
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
const Auth={key:"bm_auth",
 load(){let r=null;try{r=JSON.parse(localStorage.getItem(this.key))}catch(e){}return r||this.mem||{users:[],session:null,used:[]}},
 save(d){this.mem=d;try{localStorage.setItem(this.key,JSON.stringify(d))}catch(e){}},
 user(){const d=this.load();return d.users.find(u=>u.email===d.session)},
 state(){if(!SUBSCRIPTION_ON)return"ok";const u=this.user();return !u?"login":u.until>Date.now()?"ok":"expired"},
 days(){const u=this.user();return u?Math.max(0,Math.ceil((u.until-Date.now())/DAY)):0},
 register(e,p){const d=this.load();if(!/^\S+@\S+\.\S+$/.test(e)||p.length<6)return"fill";if(d.users.some(u=>u.email===e))return"exists";
  d.users.push({email:e,pw:hash(p),until:Date.now()+TRIAL_DAYS*DAY});d.session=e;this.save(d)},
 login(e,p){const d=this.load(),u=d.users.find(x=>x.email===e&&x.pw===hash(p));if(!u)return"badLogin";d.session=e;this.save(d)},
 logout(){const d=this.load();d.session=null;this.save(d)},
 activate(c){const d=this.load(),u=d.users.find(x=>x.email===d.session);c=(c||"").trim().toUpperCase();
  if(!DEMO_CODES.includes(c))return"badCode";if(d.used.includes(c))return"usedCode";
  u.until=Math.max(u.until,Date.now())+PLAN_DAYS*DAY;d.used.push(c);this.save(d)}};

const Cloud={
 token:(()=>{try{return localStorage.getItem("bm_token")}catch(e){return null}})(),me:null,timer:null,
 dirty(){try{return !!localStorage.getItem("bm_dirty")}catch(e){return false}},
 flag(v){try{v?localStorage.setItem("bm_dirty","1"):localStorage.removeItem("bm_dirty")}catch(e){}},
 async call(path,method="GET",body){
  const r=await fetch(API_URL+path,{method,headers:{"Content-Type":"application/json",...(this.token?{Authorization:"Bearer "+this.token}:{})},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&this.token)this.logout();
  if(!r.ok)throw Object.assign(new Error(j.detail||"error"),{detail:j.detail});
  return j},
 setToken(x){this.token=x;try{x?localStorage.setItem("bm_token",x):localStorage.removeItem("bm_token")}catch(e){}},
 async auth(mode,email,pw){const j=await this.call("/api/"+mode,"POST",{email,password:pw});this.setToken(j.token);await this.boot(true)},
 async boot(first){if(!API_URL||!this.token)return;try{this.me=await this.call("/api/me");if(first||!this.dirty())await this.pull();else await this.push()}catch(e){}render()},
 async pull(){const j=await this.call("/api/data");if(j.data){for(const k in DB)if(Array.isArray(j.data[k]))DB[k]=j.data[k];try{localStorage.setItem(Repo.key,JSON.stringify(DB))}catch(e){}}else await this.push()},
 queue(){if(!API_URL||!this.token)return;this.flag(true);clearTimeout(this.timer);this.timer=setTimeout(()=>this.push().catch(()=>{}),1200)},
 async push(){clearTimeout(this.timer);if(!API_URL||!this.token)return;await this.call("/api/data","PUT",{data:DB});this.flag(false)},
 logout(){this.setToken(null);this.me=null;chatMsgs=[];insights=null}};

function localStats(){
 const R=v=>Math.round(v*100)/100,dI=ts=>Math.round(sod(ts)/DAY),td=Math.round(TODAY/DAY),O=DB.orders.map(o=>({o,d:dI(o.date)})),T=DB.tx.map(x=>({x,d:dI(x.date)}));
 const P=Object.fromEntries(DB.products.map(p=>[p.id,p])),nm=id=>String((P[id]||{}).name||'?').slice(0,60);
 const per=(a,b)=>{let s=0,c=0,pe=0,n=0,ex=0,inc=0;
  O.forEach(({o,d})=>{if(d<a||d>=b||o.status==='cancelled')return;n++;if(o.status==='completed'){s+=oTotal(o);c+=oCost(o)}else pe+=oTotal(o)});
  T.forEach(({x,d})=>{if(d>=a&&d<b){if(x.type==='expense')ex+=x.amt;else if(x.type==='income')inc+=x.amt}});
  return{sales:R(s),cogs:R(c),expenses:R(ex),other_income:R(inc),profit:R(s+inc-c-ex),orders:n,pending:R(pe)}};
 const byP=(a,b)=>{const g={};O.forEach(({o,d})=>{if(o.status==='completed'&&d>=a&&d<b)o.items.forEach(i=>{const e=g[i.p]||(g[i.p]={qty:0,revenue:0,profit:0});e.qty+=i.q;e.revenue+=i.price*i.q;e.profit+=(i.price-i.cost)*i.q})});return g};
 const byC=(a,b)=>{const g={};T.forEach(({x,d})=>{if(x.type==='expense'&&d>=a&&d<b)g[x.cat||'-']=(g[x.cat||'-']||0)+x.amt});return g};
 const done=O.filter(z=>z.o.status==='completed').map(z=>z.d),hist=done.length?td-Math.min(...done)+1:0;
 const m0=Math.round(monthStart()/DAY),m1=Math.round(monthStart(-1)/DAY),span=td-m0+1;
 const cur=per(m0,Math.round(monthStart(1)/DAY)),prevFull=per(m1,m0),prevSame=per(m1,m1+span);
 const last=byP(td-29,td+1),before=byP(td-59,td-29),weak=[],rise=[];
 if(hist>=45){for(const id in before){const b=before[id];if(b.qty>=3){const l=last[id]?last[id].qty:0,ch=(l-b.qty)/b.qty*100;if(ch<=-30)weak.push({name:nm(+id),change_pct:Math.round(ch)})}}
  for(const id in last){const l=last[id],b=before[id]?before[id].qty:0;if(l.qty>=3&&(b===0||(l.qty-b)/b*100>=30))rise.push({name:nm(+id),prev_qty:b,cur_qty:l.qty})}}
 weak.sort((a,b)=>a.change_pct-b.change_pct);
 const low=DB.products.filter(p=>p.stock<10).map(p=>{const rt=last[p.id]?last[p.id].qty/30:0;return{name:nm(p.id),stock:p.stock,days_left:rt>0?Math.round(p.stock/rt):null}}).sort((a,b)=>a.stock-b.stock).slice(0,10);
 const cc=byC(m0,td+1),pc=byC(m1,m1+span);
 const incr=Object.keys(cc).filter(k=>cc[k]-(pc[k]||0)>=Math.max(20,(pc[k]||0)*.2)).map(k=>({cat:k,prev:R(pc[k]||0),cur:R(cc[k])})).sort((a,b)=>(b.cur-b.prev)-(a.cur-a.prev)).slice(0,5);
 const en=lang==='en',N=en?{none:'No completed orders yet, sales figures are zero.',short:'History is short ('+hist+' days): comparisons and forecasts may be unreliable.',season:'Seasonal analysis needs at least 1 year of history.',pend:'Pending orders are not counted as sales.',fc:'A forecast needs at least 4 weeks of completed sales history.'}:{none:'Tamamlanmış sifariş yoxdur, satış göstəriciləri sıfırdır.',short:'Tarixçə qısadır ('+hist+' gün): müqayisələr və proqnoz etibarsız ola bilər.',season:'Mövsümi analiz üçün ən az 1 illik tarixçə lazımdır.',pend:'Gözləyən sifarişlər satışa daxil deyil.',fc:'Proqnoz üçün ən az 4 həftəlik tamamlanmış satış tarixçəsi lazımdır.'};
 let fc={available:false,reason:N.fc};const nw=Math.min(8,Math.floor(hist/7));
 if(nw>=4){const ys=[];for(let k=nw-1;k>=0;k--)ys.push(per(td-7*k-6,td-7*k+1).sales);
  const mx=(nw-1)/2,my=ys.reduce((a,b)=>a+b,0)/nw,sl=ys.reduce((a,v,x)=>a+(x-mx)*(v-my),0)/ys.reduce((a,v,x)=>a+(x-mx)**2,0),ic=my-sl*mx,sd=Math.sqrt(ys.reduce((a,v,x)=>a+(v-ic-sl*x)**2,0)/Math.max(1,nw-2)),f=[0,1,2,3].map(k=>Math.max(0,ic+sl*(nw+k)));
  fc={available:true,weeks_used:nw,weekly:f.map(R),total:R(f.reduce((a,b)=>a+b,0)),low:R(f.reduce((a,v)=>a+Math.max(0,v-sd),0)),high:R(f.reduce((a,v)=>a+v+sd,0)),trend:my===0||Math.abs(sl)<.02*my?'flat':sl>0?'up':'down'}}
 const notes=[];if(!done.length)notes.push(N.none);else if(hist<60)notes.push(N.short);if(hist<365)notes.push(N.season);if(cur.pending||prevFull.pending)notes.push(N.pend);
 return{meta:{as_of:inp(TODAY),currency:'AZN',history_days:hist,days_in_current_month_so_far:span,products:DB.products.length,customers:DB.customers.length,orders:DB.orders.length},
  month:{current:cur,previous_same_days:prevSame,previous_full:prevFull},week:{current:per(td-6,td+1),previous:per(td-13,td-6)},
  top_products_30d:Object.entries(last).sort((a,b)=>b[1].revenue-a[1].revenue).slice(0,5).map(([id,v])=>({name:nm(+id),qty:v.qty,revenue:R(v.revenue),profit:R(v.profit)})),
  weakening:weak.slice(0,5),rising:rise.slice(0,5),low_stock:low,expenses_month_by_category:Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>({cat:k,amt:R(v)})),expense_increases:incr,forecast:fc,notes}}

async function wlStart(){

  const lib=await import(WEBLLM_URL),ids=lib.prebuiltAppConfig.model_list.map(m=>m.model_id);

  for(const id of cands){try{wl.picked=id;wl.pct=0;wl.engine=await lib.CreateMLCEngine(id,{initProgressCallback:r=>{wl.pct=Math.min(100,Math.round((r.progress||0)*100));wl.text=r.text||'';paintStatus()}});lastErr=null;break}catch(e){lastErr=e;if(!/maxComputeWorkgroupStorageSize|shader-f16|exceeds limit|requested/i.test(String(e&&e.message||e)))throw e}}

function wlFacts(k){

async function aiAsk(label,run){
 if(aiBusy)return;aiBusy=true;chatMsgs.push({role:"user",content:label},{role:"assistant",content:"…"});paintChat();
 const hist=chatMsgs.slice(0,-2).filter(x=>!x.err).map(x=>({role:x.role,content:x.content}));
 try{await Cloud.push();chatMsgs[chatMsgs.length-1]={role:"assistant",content:(await run(hist)).reply}}
 catch(e){chatMsgs[chatMsgs.length-1]={role:"assistant",content:errMsg(e),err:true}}
 aiBusy=false;paintChat()}
function aiSend(txt){const el=$("#aq"),m=(txt||el.value).trim();if(!m)return;el.value="";aiAsk(m,h=>API_URL?Cloud.call("/api/ai/chat","POST",{message:m,history:h,lang}):localChat(m,h))}
function aiReport(p){aiAsk(t(p==="weekly"?"aiRep7":"aiRepM"),()=>API_URL?Cloud.call("/api/ai/report","POST",{period:p,lang}):localReport(p))}
async function loadInsights(){try{await Cloud.push();insights=API_URL?await Cloud.call("/api/ai/insights?lang="+lang):localStats();$("#ins").innerHTML=insightsHTML(insights)}catch(e){toast(errMsg(e))}}

/* ============ UI: ümumi ============ */
const TABS=[["dash","▦"],["products","▣"],["orders","☰"],["customers","☺"],["finance","₼"],["reports","▤"],["ai","✦"]];
let view="dash",ofilter="all",rmode="weekly",q="";
function toast(m){const e=$("#toast");e.textContent=m;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",1800)}
function modal(title,html,onSave,saveLabel){
 $("#sheet").innerHTML=`<div class="row"><b style="font-size:17px">${title}</b><button class="btn ghost sm" onclick="closeM()">${t("cancel")}</button></div><div style="margin-top:14px">${html}</div>`+
 (onSave?`<button class="btn" style="width:100%;margin-top:6px" id="msave">${saveLabel||t("save")}</button>`:"");
 $("#ov").classList.add("show");if(onSave)$("#msave").onclick=onSave}
function closeM(){$("#ov").classList.remove("show")}
function ask(fn){modal(t("del"),`<p>${t("sure")}</p>`,()=>{fn();closeM();toast(t("deleted"));render()},t("del"))}
function setLang(l){lang=l;try{localStorage.setItem("bm_lang",l)}catch(e){}document.documentElement.lang=l;closeM();render()}
function go(v){view=v;q="";render();scrollTo(0,0)}
const fv=id=>document.getElementById(id).value;

function render(){
 const land=location.hash!=="#app";
 $("#landing").style.display=land?"block":"none";$("#app").style.display=land?"none":"";document.querySelector("nav").style.display=land?"none":"";
 if(land){document.querySelectorAll(".fab").forEach(e=>e.remove());$("#auth").style.display="none";landView();return}
 const g=Auth.state();$("#auth").style.display=g==="ok"?"none":"flex";
 if(g!=="ok"){document.querySelectorAll(".fab").forEach(e=>e.remove());authView(g);return}
 $("#acct").style.display=SUBSCRIPTION_ON?"":"none";if(SUBSCRIPTION_ON)$("#acct").textContent=Auth.days()+" "+t("dayShort");
 $("#sub").textContent=t("sub");
 $("#l-az").classList.toggle("on",lang==="az");$("#l-en").classList.toggle("on",lang==="en");
 $("#nav").innerHTML=TABS.map(([k,i])=>`<button class="${k===view?"on":""}" onclick="go('${k}')"><i>${i}</i>${t(k)}</button>`).join("");
 $("#main").innerHTML=V[view]();
 const fab={products:"prodForm()",orders:"orderForm()",customers:"custForm()",finance:"txForm()"}[view];
 document.querySelectorAll(".fab").forEach(e=>e.remove());
 if(fab)document.body.insertAdjacentHTML("beforeend",`<button class="fab" onclick="${fab}">＋ ${t("add")}</button>`)}

/* ============ Qrafik (SVG) ============ */
function chart(labels,series){
 const W=340,H=190,pt=10,pb=22,ph=H-pt-pb,all=series.flatMap(s=>s.v);
 const max=Math.max(1,...all),min=Math.min(0,...all),y=v=>pt+ph*(max-v)/(max-min);
 const gw=W/labels.length,bw=Math.min(14,(gw-6)/series.length);let g="";
 labels.forEach((l,i)=>{const x0=i*gw+(gw-bw*series.length)/2;
  series.forEach((s,j)=>{const v=s.v[i],yy=Math.min(y(v),y(0));g+=`<rect x="${x0+j*bw}" y="${yy}" width="${bw-1.5}" height="${Math.max(1,Math.abs(y(v)-y(0)))}" rx="2.5" fill="${s.c}"/>`});
  g+=`<text x="${i*gw+gw/2}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${g}</svg>`}

/* ============ Görünüşlər ============ */
const V={
ai(){return AI_MODE==='webllm'?wlView():aiView()},
dash(){
 const a=stats(TODAY,TODAY+DAY),m=stats(monthStart(),TODAY+DAY);
 const low=DB.products.filter(p=>p.stock<10).sort((a,b)=>a.stock-b.stock);
 const rec=[...DB.orders].reverse().slice(0,4);
 const isEmpty=!DB.products.length&&!DB.customers.length&&!DB.orders.length;
 const hintBox=isEmpty?`<div class="card" style="grid-column:span 2"><b>${t("emptyT")}</b><p style="margin:6px 0 10px;color:var(--mut)">${t("emptyD")}</p><div class="row"><button class="btn sm" onclick="go('products')">${t("newProd")}</button><button class="btn ghost sm" onclick="loadSample()">${t("loadSample")}</button></div></div>`:"";
 return `<div class="grid">
 ${hintBox}<div class="card kpi main"><small>${t("profit")} · ${t("month")}</small><b>${money(m.profit)}</b></div>
 <div class="card kpi"><small>${t("sales")} · ${t("today")}</small><b>${money(a.sales)}</b></div>
 <div class="card kpi"><small>${t("sales")} · ${t("month")}</small><b>${money(m.sales)}</b></div>
 <div class="card kpi"><small>${t("expenses")} · ${t("today")}</small><b>${money(a.exp)}</b></div>
 <div class="card kpi"><small>${t("expenses")} · ${t("month")}</small><b>${money(m.exp)}</b></div>
 <div class="card kpi"><small>${t("orderCount")} · ${t("today")}</small><b>${a.count}</b></div>
 <div class="card kpi"><small>${t("orderCount")} · ${t("month")}</small><b>${m.count}</b></div><div class="card kpi" style="grid-column:span 2"><small>${t("pending")}</small><b>${money(m.pending)}</b></div></div>
 <h2>${t("lowStock")}</h2><div class="list">${low.length?low.map(p=>`<div class="card row"><span>${esc(p.name)}</span><span class="tag low">${p.stock} ${t("pcs")}</span></div>`).join(""):`<div class="empty">${t("none")}</div>`}</div>
 <h2>${t("recent")}</h2><div class="list">${rec.map(orderCard).join("")}</div>`},

products(){
 const l=DB.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));
 return `<input placeholder="${t("search")}" value="${esc(q)}" oninput="q=this.value;search()" id="srch">
 <div class="list" id="plist" style="margin-top:10px">${prodList(l)}</div>`},

customers(){
 const l=DB.customers.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
 return `<input placeholder="${t("search")}" value="${esc(q)}" oninput="q=this.value;search()" id="srch">
 <div class="list" id="plist" style="margin-top:10px">${custList(l)}</div>`},

orders(){
 const sts=["all","new","preparing","completed","cancelled"];
 const l=[...DB.orders].reverse().filter(o=>ofilter==="all"||o.status===ofilter).slice(0,40);
 return `<div class="chips">${sts.map(s=>`<button class="${s===ofilter?"on":""}" onclick="ofilter='${s}';render()">${t(s)}</button>`).join("")}</div>
 <div class="list">${l.length?l.map(o=>orderCard(o,true)).join(""):`<div class="empty">${t("none")}</div>`}</div>`},

finance(){
 const ms=monthStart(),x=DB.tx.filter(z=>z.date>=ms).sort((a,b)=>b.date-a.date),st=stats(ms,TODAY+DAY);
 const all=[...DB.tx].sort((a,b)=>b.date-a.date).slice(0,30);
 return `<div class="grid"><div class="card kpi"><small>${t("income")} · ${t("month")}</small><b class="pos">${money(st.inc)}</b></div>
 <div class="card kpi"><small>${t("expense")} · ${t("month")}</small><b class="neg">${money(st.exp)}</b></div>
 <div class="card kpi main"><small>${t("netCash")} (${t("sales")} ${money(st.sales)})</small><b>${money(st.sales+st.inc-st.exp)}</b></div></div>
 <h2>${t("otherInc")}</h2><small style="color:var(--mut)">${t("salesNote")}</small>
 <div class="list" style="margin-top:8px">${all.map(z=>`<div class="card row"><div class="item"><b>${esc(z.cat)}</b><small>${dstr(z.date)}${z.note?" · "+esc(z.note):""}</small></div>
 <div style="text-align:right"><div class="amt ${z.type==="income"?"pos":"neg"}">${z.type==="income"?"+":"−"}${money(z.amt)}</div>
 <button class="btn danger sm" onclick="ask(()=>{DB.tx=DB.tx.filter(q=>q.id===${z.id}?false:true);Repo.persist()})">✕</button></div></div>`).join("")}</div>`},

reports(){
 let labels=[],ranges=[];
 if(rmode==="weekly"){for(let i=6;i>=0;i--){const f=TODAY-i*DAY;ranges.push([f,f+DAY]);labels.push(new Date(f).toLocaleDateString(loc(),{weekday:"short"}))}}
 else{for(let i=5;i>=0;i--){ranges.push([monthStart(-i),i===0?TODAY+DAY:monthStart(-i+1)]);labels.push(new Date(monthStart(-i)).toLocaleDateString(loc(),{month:"short"}))}}
 const S=ranges.map(r=>stats(r[0],r[1]));
 const tot=S.reduce((a,s)=>({sales:a.sales+s.sales,exp:a.exp+s.exp,profit:a.profit+s.profit}),{sales:0,exp:0,profit:0});
 return `<div class="chips"><button class="${rmode==="weekly"?"on":""}" onclick="rmode='weekly';render()">${t("weekly")}</button><button class="${rmode==="monthly"?"on":""}" onclick="rmode='monthly';render()">${t("monthly")}</button></div>
 <div class="card"><div class="legend"><span style="--c:#1d4ed8">${t("sales")}</span><span style="--c:#94a3b8">${t("expenses")}</span><span style="--c:#38bdf8">${t("profit")}</span></div>
 ${chart(labels,[{v:S.map(s=>s.sales),c:"#1d4ed8"},{v:S.map(s=>s.exp),c:"#94a3b8"},{v:S.map(s=>s.profit),c:"#38bdf8"}])}</div>
 <div class="grid" style="margin-top:10px"><div class="card kpi"><small>${t("sales")}</small><b>${money(tot.sales)}</b></div><div class="card kpi"><small>${t("profit")}</small><b>${money(tot.profit)}</b></div></div>
 <h2>${t("total")}</h2><div class="card"><table><tr><th></th><th>${t("sales")}</th><th>${t("expenses")}</th><th>${t("profit")}</th></tr>
 ${labels.map((l,i)=>`<tr><td>${esc(l)}</td><td>${S[i].sales.toFixed(0)}</td><td>${S[i].exp.toFixed(0)}</td><td class="${S[i].profit<0?"neg":""}">${S[i].profit.toFixed(0)}</td></tr>`).join("")}</table></div>`}
};

function search(){const l=view==="products"?DB.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())):DB.customers.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));
 $("#plist").innerHTML=view==="products"?prodList(l):custList(l)}
function prodList(l){return l.length?l.map(p=>`<div class="card"><div class="row"><div class="item"><b>${esc(p.name)}</b><small>${t("buy")}: ${money(p.buy)} · ${t("sell")}: ${money(p.sell)}</small></div>
 <span class="tag ${p.stock<10?"low":""}">${p.stock} ${t("pcs")}</span></div>
 <div class="row" style="margin-top:9px"><small style="color:var(--mut)">${t("margin")}: ${p.sell?Math.round((p.sell-p.buy)/p.sell*100):0}%</small>
 <span><button class="btn ghost sm" onclick="prodForm(${p.id})">${t("edit")}</button> <button class="btn danger sm" onclick="ask(()=>{DB.products=DB.products.filter(x=>x.id!==${p.id});Repo.persist()})">${t("del")}</button></span></div></div>`).join(""):`<div class="empty">${t("none")}</div>`}
function custList(l){return l.length?l.map(c=>{const os=DB.orders.filter(o=>o.cust===c.id&&o.status==="completed");
 return `<div class="card row" onclick="custHist(${c.id})"><div class="item"><b>${esc(c.name)}</b><small>${esc(c.phone)} · ${os.length} ${t("orders_n")}</small></div><span class="amt">${money(os.reduce((a,o)=>a+oTotal(o),0))}</span></div>`}).join(""):`<div class="empty">${t("none")}</div>`}
function orderCard(o,full){return `<div class="card"><div class="row"><div class="item"><b>#${o.id} · ${esc(cname(o.cust))}</b><small>${dstr(o.date)} · ${o.items.map(i=>esc(pname(i.p))+" ×"+i.q).join(", ")}</small></div>
 <span class="amt">${money(oTotal(o))}</span></div>
 <div class="row" style="margin-top:9px"><span class="tag ${o.status}">${t(o.status)}</span>${full?`<select style="width:auto;margin:0" onchange="setStatus(${o.id},this.value)">${["new","preparing","completed","cancelled"].map(s=>`<option value="${s}" ${s===o.status?"selected":""}>${t(s)}</option>`).join("")}</select>`:""}</div></div>`}

/* ============ Əməliyyatlar ============ */
function prodForm(id){
 const p=id?DB.products.find(x=>x.id===id):{name:"",buy:"",sell:"",stock:""};
 modal(id?t("edit"):t("newProd"),`<label>${t("name")}<input id="f1" value="${esc(p.name)}"></label><div class="grid"><label>${t("buy")} (₼)<input id="f2" type="number" step="0.01" inputmode="decimal" value="${p.buy}"></label><label>${t("sell")} (₼)<input id="f3" type="number" step="0.01" inputmode="decimal" value="${p.sell}"></label></div><label>${t("stock")}<input id="f4" type="number" inputmode="numeric" value="${p.stock}"></label>`,()=>{
  const d={name:fv("f1").trim(),buy:parseFloat(fv("f2")),sell:parseFloat(fv("f3")),stock:parseInt(fv("f4"))};
  if(!d.name||isNaN(d.buy)||isNaN(d.sell)||isNaN(d.stock)||d.buy<0||d.sell<0||d.stock<0)return toast(t("fill"));
  if(id)Object.assign(p,d);else DB.products.push({id:uid(DB.products),...d});
  Repo.persist();closeM();toast(t("saved"));render()})}
function custForm(){modal(t("newCust"),`<label>${t("name")}<input id="f1"></label><label>${t("phone")}<input id="f2" type="tel" placeholder="+994"></label>`,()=>{
 if(!fv("f1").trim())return toast(t("fill"));DB.customers.push({id:uid(DB.customers),name:fv("f1").trim(),phone:fv("f2").trim()});Repo.persist();closeM();toast(t("saved"));render()})}
function custHist(id){const c=DB.customers.find(x=>x.id===id),os=[...DB.orders].reverse().filter(o=>o.cust===id).slice(0,15);
 modal(esc(c.name),`<small style="color:var(--mut)">${esc(c.phone)}</small><h2 style="margin-top:10px">${t("history")}</h2><div class="list">${os.length?os.map(o=>orderCard(o)).join(""):`<div class="empty">${t("none")}</div>`}</div>`)}
function addLine(){const d=document.createElement("div");d.className="grid";d.style.gridTemplateColumns="2fr 1fr";
 d.innerHTML=`<label><select class="lp">${DB.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${t("pcs")}: ${p.stock})</option>`).join("")}</select></label><label><input class="lq" type="number" min="1" value="1" inputmode="numeric"></label>`;$("#lines").appendChild(d)}
function orderForm(){
 modal(t("newOrder"),`<label>${t("customer")}<select id="oc">${DB.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label>
 <div class="row" style="color:var(--mut);font-size:13px;margin-bottom:4px"><span>${t("product")}</span><span style="width:33%">${t("qty")}</span></div><div id="lines"></div>
 <button class="btn ghost sm" style="margin-bottom:12px" onclick="addLine()">${t("addLine")}</button>`,()=>{
  const ps=[...document.querySelectorAll(".lp")],qs=[...document.querySelectorAll(".lq")],items=[],need={};
  ps.forEach((s,i)=>{const p=DB.products.find(x=>x.id==s.value),n=parseInt(qs[i].value);if(p&&n>0){need[p.id]=(need[p.id]||0)+n;items.push({p:p.id,q:n,price:p.sell,cost:p.buy})}});
  if(!items.length||!DB.customers.length)return toast(t("fill"));
  for(const id in need)if(DB.products.find(p=>p.id==id).stock<need[id])return toast(t("noStock"));
  for(const id in need)DB.products.find(p=>p.id==id).stock-=need[id];
  DB.orders.push({id:uid(DB.orders),cust:parseInt(fv("oc")),date:Date.now(),status:"new",items});
  Repo.persist();closeM();toast(t("saved"));render()});
 addLine()}
function setStatus(id,s){const o=DB.orders.find(x=>x.id===id),old=o.status;
 const move=sign=>o.items.forEach(i=>{const p=DB.products.find(x=>x.id===i.p);if(p)p.stock=Math.max(0,p.stock+sign*i.q)});
 if(s==="cancelled"&&old!=="cancelled")move(1);
 if(old==="cancelled"&&s!=="cancelled")move(-1);
 o.status=s;Repo.persist();toast(t("saved"));render()}
function txForm(){modal(t("newTx"),`<label>${t("type")}<select id="f1"><option value="expense">${t("expense")}</option><option value="income">${t("income")}</option></select></label>
 <label>${t("category")}<input id="f2"></label><div class="grid"><label>${t("amount")} (₼)<input id="f3" type="number" step="0.01" inputmode="decimal"></label><label>${t("date")}<input id="f4" type="date" value="${inp(TODAY)}"></label></div><label>${t("note")}<input id="f5"></label>`,()=>{
 const a=parseFloat(fv("f3")),d=new Date(fv("f4")+"T00:00:00").getTime();
 if(!fv("f2").trim()||!(a>0)||isNaN(d))return toast(t("fill"));
 DB.tx.push({id:uid(DB.tx),type:fv("f1"),cat:fv("f2").trim(),amt:a,date:d,note:fv("f5").trim()});Repo.persist();closeM();toast(t("saved"));render()})}

document.documentElement.lang=lang;render();Cloud.boot();
</script>
